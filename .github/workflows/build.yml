
name: Build DJRT Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows App
        run: npx --yes electron-builder --win nsis portable --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: DJRT-Windows-App
          path: dist/*.exe
          if-no-files-found: error
          
